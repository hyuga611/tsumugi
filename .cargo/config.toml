# 出力はリポジトリ内の target/ に固定する。
#
# 共有の target ディレクトリを使うと、環境によっては（Windows の
# アプリケーション制御ポリシーなど）そこから実行ファイルを起動できない。
# ビルドは通るのに起動だけ落ちるので、原因を取り違えやすい。
#
# ⚠️ 環境変数 CARGO_TARGET_DIR はこの設定より優先される。
#    シェルに CARGO_TARGET_DIR が設定されている場合は、明示的に上書きすること:
#      CARGO_TARGET_DIR=./target cargo run -p tsg
[build]
target-dir = "target"

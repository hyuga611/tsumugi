[package]
name = "tsg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
arboard = "3.6.1"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# 自分で取ってくる。**外の台本を起こして落とさせない** —
# `powershell -Command "irm <URL> | iex"` は取ってきて実行するマルウェアと
# 同じ形なので、ウイルス対策に止められる（実機で踏んだ）。
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "display", "serde"] }
tsg-buffer = { version = "0.3.12", path = "../tsg-buffer" }
tsg-modal = { version = "0.3.12", path = "../tsg-modal" }
tsg-lsp = { version = "0.3.12", path = "../tsg-lsp" }
tsg-mux = { version = "0.3.12", path = "../tsg-mux" }
tsg-pty = { version = "0.3.12", path = "../tsg-pty" }
tsg-render = { version = "0.3.12", path = "../tsg-render" }
tsg-term = { version = "0.3.12", path = "../tsg-term" }
winit = "0.30.13"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Globalization"] }
